name: Build, Package and Release macOS Binary with Changelog

on:
  push:
    tags:
      - 'v*.*.*'

env:
  TAP_REPO: StarkChristmas/homebrew-ip

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Extract version
        id: vars
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          echo "TAG_NAME=${GITHUB_REF##*/}" >> $GITHUB_ENV

      - name: Build for arm64 and x86_64
        run: |
          mkdir dist

          GOOS=darwin GOARCH=arm64 go build -o dist/ip_arm64 main.go
          tar -czvf dist/ip_macos_${VERSION}_arm64.tar.gz -C dist ip_arm64

          GOOS=darwin GOARCH=amd64 go build -o dist/ip_x86_64 main.go
          tar -czvf dist/ip_macos_${VERSION}_x86_64.tar.gz -C dist ip_x86_64

      - name: Generate changelog with download links
        id: changelog
        run: |
          echo "## Changelog" > CHANGELOG.md
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log ${PREV_TAG}..${VERSION} --pretty=format:"- %s (%an)" >> CHANGELOG.md
          else
            echo "- Initial release" >> CHANGELOG.md
          fi

          echo "" >> CHANGELOG.md
          echo "| 平台 | 架构 | 下载链接 |" >> CHANGELOG.md
          echo "|------|------|-----------|" >> CHANGELOG.md
          echo "| macOS | arm64 | [ip_macos_${VERSION}_arm64.tar.gz](https://github.com/StarkChristmas/ip/releases/download/${VERSION}/ip_macos_${VERSION}_arm64.tar.gz) |" >> CHANGELOG.md
          echo "| macOS | x86_64 | [ip_macos_${VERSION}_x86_64.tar.gz](https://github.com/StarkChristmas/ip/releases/download/${VERSION}/ip_macos_${VERSION}_x86_64.tar.gz) |" >> CHANGELOG.md

          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          token: ${{ secrets.GH_TOKEN }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/ip_macos_${{ env.VERSION }}_arm64.tar.gz
            dist/ip_macos_${{ env.VERSION }}_x86_64.tar.gz
          token: ${{ secrets.GH_TOKEN }}
