name: Build, Package and Release macOS Binary with Changelog

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # 获取完整提交历史用于 changelog

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.18'

      - name: Build macOS executable
        run: |
          go build -o ipget-macos main.go

      - name: Package binary into tar.gz
        run: |
          tar czvf ipget-macos.tar.gz ipget-macos

      - name: Generate changelog
        id: changelog
        run: |
          echo "## Changelog" > CHANGELOG.md

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "Previous tag: $PREV_TAG"

          if [ -n "$PREV_TAG" ]; then
            git log ${PREV_TAG}..${GITHUB_REF#refs/tags/} --pretty=format:"- %s (%an)" >> CHANGELOG.md
          else
            echo "- Initial release" >> CHANGELOG.md
          fi

          echo "CHANGELOG.md content:"
          cat CHANGELOG.md

          # 输出 changelog 到 GITHUB_OUTPUT
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: ipget-macos.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
